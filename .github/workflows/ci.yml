name: CI
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # the e2e test uses Node's built-in WebSocket client
      - name: Install Python
        run: apt-get update -qq && apt-get install -y -qq python3
      - name: Web assets are up to date
        run: python3 -I scripts/embed-webclient.py && git diff --exit-code
      - name: Swift tests
        run: swift test
      - name: Web tests (gestures + end-to-end against the dev server)
        run: swift build --product overscreen-devserver && node --test Tests/web/*.test.cjs

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: swift test
      - name: Build app
        run: scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Overscreen.app
          path: build/Overscreen.app
