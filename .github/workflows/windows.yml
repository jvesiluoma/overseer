name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:

# Builds and tests the Windows host on a real Windows machine, including the display path:
# Virtual Display Driver, Desktop Duplication capture through FFmpeg, input, and a real
# Chrome receiving the stream over WebRTC.
jobs:
  windows:
    runs-on: windows-2025
    env:
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-win64-gpl-8.1.zip
      FFMPEG_SHA256: 7b801cdd3a1a0bb54ae6f572187e68b4ed54f52086cfee133fab2180bfb429fa
      VDD_URL: https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.7.23/VirtualDisplayDriver-x86.Driver.Only.zip
      VDD_SHA256: e24210692b442b39af763536330ce78b423f19342b7a7792c26de3944e418b3a
      NEFCON_URL: https://github.com/nefarius/nefcon/releases/download/v1.14.0/nefcon_v1.14.0.zip
      NEFCON_SHA256: a15557da24a9efca203158de3b43b0eaf982db231f0194031f1ed428bc13e669
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Unit tests
        run: go test ./WindowsHost/...

      - name: Build
        run: |
          go build -o build/go/overscreen-devserver.exe ./WindowsHost/cmd/overscreen-devserver
          go build -ldflags "-H windowsgui" -o build/go/Overscreen.exe ./WindowsHost/cmd/overscreen

      - name: Protocol tests against the Go server
        shell: bash
        run: OVERSCREEN_DEVSERVER="$PWD/build/go/overscreen-devserver.exe" node --test Tests/web/e2e.test.cjs Tests/web/tls.test.cjs

      - name: Fetch FFmpeg (pinned, checksum-verified)
        shell: pwsh
        run: |
          Invoke-WebRequest $env:FFMPEG_URL -OutFile ffmpeg.zip
          if ((Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash -ne $env:FFMPEG_SHA256) { throw "FFmpeg checksum mismatch" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-x
          $exe = Get-ChildItem ffmpeg-x -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName build/go/ffmpeg.exe
          "FFMPEG=$((Resolve-Path build/go/ffmpeg.exe).Path)" >> $env:GITHUB_ENV

      - name: Install the Virtual Display Driver (pinned, checksum-verified)
        shell: pwsh
        run: |
          Invoke-WebRequest $env:VDD_URL -OutFile vdd.zip
          if ((Get-FileHash vdd.zip -Algorithm SHA256).Hash -ne $env:VDD_SHA256) { throw "driver checksum mismatch" }
          Invoke-WebRequest $env:NEFCON_URL -OutFile nefcon.zip
          if ((Get-FileHash nefcon.zip -Algorithm SHA256).Hash -ne $env:NEFCON_SHA256) { throw "nefcon checksum mismatch" }
          Expand-Archive vdd.zip -DestinationPath vdd
          Expand-Archive nefcon.zip -DestinationPath nefcon
          New-Item -ItemType Directory -Force C:\VirtualDisplayDriver | Out-Null
          Copy-Item vdd\VirtualDisplayDriver\vdd_settings.xml C:\VirtualDisplayDriver\
          # Trust the driver's publisher (as the driver's own silent installer does), then install.
          $certs = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2Collection
          $certs.Import([System.IO.File]::ReadAllBytes((Resolve-Path vdd\VirtualDisplayDriver\mttvdd.cat)))
          foreach ($c in $certs) {
            $path = "$env:TEMP\$($c.Thumbprint).cer"
            [System.IO.File]::WriteAllBytes($path, $c.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
            Import-Certificate -FilePath $path -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          }
          $inf = (Resolve-Path vdd\VirtualDisplayDriver\MttVDD.inf).Path
          Start-Process -Wait -FilePath .\nefcon\x64\nefconw.exe -ArgumentList 'install', "`"$inf`"", 'Root\MttVDD'
          Start-Sleep -Seconds 10
          Get-PnpDevice -Class Display | Format-Table -AutoSize Status, FriendlyName, InstanceId
          Get-ChildItem \\.\pipe\ | Where-Object Name -like '*Virtual*' | Format-Table Name

      - name: Display integration tests
        run: go test -tags integration -v -count=1 ./WindowsHost/internal/winplat

      - name: Browser streaming test (virtual display)
        if: always()
        working-directory: Tests/browser
        run: |
          npm ci
          node stream.cjs ../../build/go/overscreen-devserver.exe --media native

      - name: Browser streaming test (mirror main screen)
        if: always()
        working-directory: Tests/browser
        run: node stream.cjs ../../build/go/overscreen-devserver.exe --media native --mirror
