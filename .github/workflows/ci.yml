name: CI
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22   # the e2e test uses Node's built-in WebSocket client
      - name: Install Python
        run: apt-get update -qq && apt-get install -y -qq python3
      - name: Web assets are up to date
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"  # the container runs as root
          python3 -I scripts/embed-webclient.py && git diff --exit-code
      - name: Swift tests
        run: scripts/ci-run.sh "Swift tests (Linux)" swift test
      - name: Web tests (gestures + end-to-end against the dev server)
        run: swift build --product overscreen-devserver && node --test Tests/web/*.test.cjs

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Vet (Linux and Windows builds)
        run: go vet ./... && GOOS=windows go vet ./... && GOOS=windows go vet -tags integration ./...
      - name: Go tests
        run: go test -race ./WindowsHost/...
      - name: Protocol tests against the Go server
        run: |
          go build -o build/go/overscreen-devserver ./WindowsHost/cmd/overscreen-devserver
          OVERSCREEN_DEVSERVER=$PWD/build/go/overscreen-devserver node --test Tests/web/*.test.cjs
      - name: Browser streaming test (FFmpeg test pattern → Chrome over WebRTC)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          cd Tests/browser && npm ci && CHROME=$(command -v google-chrome) node stream.cjs ../../build/go/overscreen-devserver

  macos:
    runs-on: macos-26   # Xcode 26: the pinned Swift packages need a newer toolchain than macos-15 has
    steps:
      - uses: actions/checkout@v5
      - name: Core tests
        run: scripts/ci-run.sh "Swift tests (macOS)" swift test
      - name: Build app
        run: scripts/ci-run.sh "Build app" scripts/build-app.sh
      - uses: actions/upload-artifact@v5
        with:
          name: Overscreen.app
          path: build/Overscreen.app
